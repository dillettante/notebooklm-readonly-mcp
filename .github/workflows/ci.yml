name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.17
      - run: uv lock --check
      - run: uv sync --frozen --no-editable --group dev
      - run: uv run --frozen --no-editable pytest
      - run: uv run --frozen --no-editable ruff check .
      - run: uv run --frozen --no-editable python scripts/check_public.py
      - run: uv build
