[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-readonly-mcp"
version = "0.1.0"
description = "Portable NotebookLM retrieval and grounded Q&A over local MCP or OAuth-protected HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["notebooklm-py[browser]==0.8.5", "mcp==1.28.1", "PyJWT[crypto]>=2.10.1,<3"]

[project.scripts]
notebooklm-readonly-mcp = "notebooklm_readonly_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/dillettante/notebooklm-readonly-mcp"
Issues = "https://github.com/dillettante/notebooklm-readonly-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "build>=1.2,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
